<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>alv_hud</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="hud" class="is-hidden">

        <!-- Esquina inferior izquierda: ubicación + estado -->
        <section class="status-area">
            <div class="location" data-el="location">
                <span class="location__compass" data-el="compass">N</span>
                <span class="location__street" data-el="street"></span>
                <span class="location__zone" data-el="zone"></span>
            </div>

            <div class="rings">
                <div class="ring ring--health" data-ring="health">
                    <svg viewBox="0 0 40 40"><circle class="ring__track" cx="20" cy="20" r="17" pathLength="100"/><circle class="ring__fill" cx="20" cy="20" r="17" pathLength="100"/></svg>
                    <svg class="ring__icon" viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
                </div>

                <div class="ring ring--armor" data-ring="armor">
                    <svg viewBox="0 0 40 40"><circle class="ring__track" cx="20" cy="20" r="17" pathLength="100"/><circle class="ring__fill" cx="20" cy="20" r="17" pathLength="100"/></svg>
                    <svg class="ring__icon" viewBox="0 0 24 24"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg>
                </div>

                <div class="ring ring--hunger" data-ring="hunger">
                    <svg viewBox="0 0 40 40"><circle class="ring__track" cx="20" cy="20" r="17" pathLength="100"/><circle class="ring__fill" cx="20" cy="20" r="17" pathLength="100"/></svg>
                    <svg class="ring__icon" viewBox="0 0 24 24"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>
                </div>

                <div class="ring ring--thirst" data-ring="thirst">
                    <svg viewBox="0 0 40 40"><circle class="ring__track" cx="20" cy="20" r="17" pathLength="100"/><circle class="ring__fill" cx="20" cy="20" r="17" pathLength="100"/></svg>
                    <svg class="ring__icon" viewBox="0 0 24 24"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/></svg>
                </div>

                <div class="ring ring--stamina" data-ring="stamina">
                    <svg viewBox="0 0 40 40"><circle class="ring__track" cx="20" cy="20" r="17" pathLength="100"/><circle class="ring__fill" cx="20" cy="20" r="17" pathLength="100"/></svg>
                    <svg class="ring__icon" viewBox="0 0 24 24"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>
                </div>

                <div class="ring ring--oxygen" data-ring="oxygen">
                    <svg viewBox="0 0 40 40"><circle class="ring__track" cx="20" cy="20" r="17" pathLength="100"/><circle class="ring__fill" cx="20" cy="20" r="17" pathLength="100"/></svg>
                    <svg class="ring__icon" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><circle cx="16.5" cy="7.5" r="3"/><circle cx="17.5" cy="17.5" r="2"/></svg>
                </div>

                <div class="ring ring--voice" data-ring="voice">
                    <svg viewBox="0 0 40 40"><circle class="ring__track" cx="20" cy="20" r="17" pathLength="100"/><circle class="ring__fill" cx="20" cy="20" r="17" pathLength="100"/></svg>
                    <svg class="ring__icon" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3"/></svg>
                </div>
            </div>
        </section>

        <!-- Esquina inferior derecha: vehículo -->
        <section class="vehicle" data-el="vehicle">
            <div class="vehicle__speed">
                <span class="vehicle__value" data-el="speed">0</span>
                <span class="vehicle__unit" data-el="unit">KM/H</span>
            </div>

            <div class="vehicle__row">
                <span class="vehicle__gear" data-el="gear">N</span>
                <div class="bar"><div class="bar__fill bar__fill--rpm" data-el="rpm"></div></div>
            </div>

            <div class="vehicle__row" data-el="fuelRow">
                <svg class="vehicle__icon" viewBox="0 0 24 24"><path d="M3 22h12M4 9h10M14 22V4a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v18M14 13h2a2 2 0 0 1 2 2v2a2 2 0 0 0 2 2 2 2 0 0 0 2-2V9.83a2 2 0 0 0-.59-1.42L18 5"/></svg>
                <div class="bar"><div class="bar__fill bar__fill--fuel" data-el="fuel"></div></div>
            </div>

            <svg class="vehicle__engine" data-el="engine" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3M12 9v4M12 17h.01"/></svg>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
